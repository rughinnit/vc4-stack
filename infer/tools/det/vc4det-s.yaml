# vc4det-s -- the same graph as vc4det-n at width 0.5 (32/64/128 channels).
# See vc4det-n.yaml for the layer choices and why.
nc: 1
activation: nn.SiLU()
scales:
  s: [0.50, 0.50, 512]
backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0  stem      3 -> 32, /2   (96 -> 48)
  - [-1, 1, Conv, [128, 3, 2]]      # 1  stage 1  32 -> 64, /2   (48 -> 24)
  - [-1, 2, Conv, [128, 3, 1]]      # 2  stage 1  64 -> 64, depth-scaled
  - [-1, 1, Conv, [256, 3, 2]]      # 3  stage 2  64 -> 128, /2  (24 -> 12)
  - [-1, 2, Conv, [256, 3, 1]]      # 4  stage 2  128 -> 128, depth-scaled
head:
  - [-1, 1, Conv, [128, 1, 1]]      # 5  P3 pointwise fusion, 128 -> 64 at 12
  - [-1, 1, Conv, [128, 3, 1]]      # 6  P3 3x3, 64 at 12
  - [-1, 1, nn.Conv2d, [64, 6, 1]]  # 7  logits: obj, cx, cy, w, h, class
