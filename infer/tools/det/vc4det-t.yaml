# vc4det-t -- the same layer family with the depth and part of the head removed.
# Not a detector proposal: it is the low point of the launch-count slope, so a
# measurement at 5 convs and one at 8 convs give the marginal cost of a conv
# (two launches) on this engine.  See vc4det-n.yaml for the layer rules.
nc: 1
activation: nn.SiLU()
scales:
  t: [0.50, 0.25, 512]
backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0  stem      3 -> 16, /2   (96 -> 48)
  - [-1, 1, Conv, [128, 3, 2]]      # 1  stage 1  16 -> 32, /2   (48 -> 24)
  - [-1, 1, Conv, [256, 3, 2]]      # 2  stage 2  32 -> 64, /2   (24 -> 12)
head:
  - [-1, 1, Conv, [128, 1, 1]]      # 3  P3 pointwise, 64 -> 32 at 12
  - [-1, 1, nn.Conv2d, [32, 6, 1]]  # 4  logits
