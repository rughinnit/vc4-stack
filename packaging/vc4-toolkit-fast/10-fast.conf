# vc4-toolkit-fast: the speed-tuned vc4d arguments.
#
# This file is installed by the package postinst and is what vc4fast on/off
# toggles.  The drop-in resets EnvironmentFile so /etc/default/vc4d is not
# read; the replacement file below carries the tuned argv.
#
# --arena-mb 150   the measured 320x320 recipe: the largest bundled YOLOv8n
#                  graph needs ~91 MiB of client arena (activations + weights
#                  + the per-conv im2col scratch) and the extra headroom keeps
#                  a second model's weights resident.  CMA is 256 MiB on this
#                  board; 150 still leaves the display and the firmware room.
# --max-timeout-ms 60000
#                  one launch may take longer while the kernel cache is cold:
#                  the first 784-launch YOLOv8n run JITs its kernels and can
#                  exceed 10 s under load.  A timeout here kills the daemon,
#                  so the fast recipe is deliberately generous.
#
# Neither value changes a clock.  The board stays at stock 400/300 MHz.
[Service]
EnvironmentFile=
EnvironmentFile=/etc/vc4/vc4d-fast.default
