# vc4det-n -- single-scale detector sized for the VideoCore IV QPU engine.
#
# Every layer is a 1x1 or 3x3 dense convolution with SiLU.  The epilogue pass
# folds each SiLU into the conv store, so one conv is two launches (im2col +
# GEMM) and no activation launch.  There is no depthwise conv: the engine
# expands depthwise to a block-diagonal dense weight and multiplies by Cin
# (docs/ONNX.md sec. 8.1), so a depthwise layer costs more than the pointwise
# layer that replaces it.  There is no Split, no Concat, no attention, no DFL:
# the head is a conv chain on one feature level, so no host copy runs.
#
# Residuals are absent on purpose: an Add over a pitched NHWC plane is 3-6
# elementwise launches, and two of them cost more than a whole 3x3 conv.
#
# Width 0.25 -> 16/32/64 channels; depth 0.5 -> one 3x3 per stage, depth 1.0
# -> two.  `infer/tools/det/build.py` audits the channels and the ONNX ops.
nc: 3
activation: nn.SiLU()
scales:
  n: [0.50, 0.25, 512]
backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0  stem      3 -> 16, /2   (96 -> 48)
  - [-1, 1, Conv, [128, 3, 2]]      # 1  stage 1  16 -> 32, /2   (48 -> 24)
  - [-1, 2, Conv, [128, 3, 1]]      # 2  stage 1  32 -> 32, depth-scaled
  - [-1, 1, Conv, [256, 3, 2]]      # 3  stage 2  32 -> 64, /2   (24 -> 12)
  - [-1, 2, Conv, [256, 3, 1]]      # 4  stage 2  64 -> 64, depth-scaled
head:
  - [-1, 1, Conv, [128, 1, 1]]      # 5  P3 pointwise fusion, 64 -> 32 at 12
  - [-1, 1, Conv, [128, 3, 1]]      # 6  P3 3x3, 32 at 12
  - [-1, 1, nn.Conv2d, [32, 8, 1]]  # 7  logits: obj, cx, cy, w, h, 3 class scores
